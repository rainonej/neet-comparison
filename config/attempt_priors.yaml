# Continuation priors for NEET sittings — NOT measured national facts.
# See docs/ATTEMPT_PRIORS.md.
#
# Model: after sitting t (1-indexed), P(sit again | still in pool) = r_t.
# Exit from the pool = acceptable seat joined OR resource/psych/alt-path exit.
# "Qualify" alone is NOT an exit (counselling / affordability may still fail).
#
# tn_post_neet_calibrated is injected at runtime so P(sittings=1) matches the
# applicant first-share implied by Rajan admitted repeater share under ρ.

model_version: "0.2.0"
success_exit: "accepted_or_joined_acceptable_seat"
not_success_exit: "neet_qualify_percentile_alone"

# Heterogeneity anchors (composition among ADMITTED, wrong denominator for applicants)
anchors:
  rajan_tn_repeater_share_admitted_2020_21:
    value: 0.7142
    grain: admitted_tamil_nadu
    source: Justice A.K. Rajan Committee 2021 Table 7.38
  rajan_tn_first_among_admitted_2020_21:
    value: 0.2858
    grain: admitted_tamil_nadu
    source: Justice A.K. Rajan Committee 2021 Table 7.38
    note: >
      Current-year students among MBBS admits. Best in-repo proxy that winners are
      often older than a first-sit school-leaver. Not national birth-year microdata.
  rajan_tn_repeater_share_admitted_pre_neet_mean:
    value: 0.0812
    grain: admitted_tamil_nadu_pre_neet
    source: Justice A.K. Rajan Committee 2021 (pre-NEET average cited in prose)
  rajan_coaching_among_admitted_2019_20:
    value: 0.99
    grain: admitted_tamil_nadu
    source: Justice A.K. Rajan Committee Figure 7.24
  rajan_repeater_exclusive_coaching_inr:
    value: 1000000
    grain: narrative_tn
    source: Justice A.K. Rajan Committee §5.4
  rajan_avg_coaching_cost_inr:
    value: 95033
    grain: derived_tn_packages
    source: Justice A.K. Rajan Committee §7.5.9.1
  aiims_bhopal_first_attempt_among_admitted:
    value: 0.66
    grain: admitted_aiims_bhopal_selected_sample
    note: >
      Prose-reported ~66% first-attempt among a small MBBS admission sample;
      verify primary paper before treating as a hard calibration target.
      Highly selected institute; not NEET applicant population.
  korea_csat_2024_non_current_hs_share:
    value: 0.354
    grain: external_analog
    note: Share of CSAT takers who were not current high-school students (not exact retaker rate).
  mcat_share_tested_3_plus:
    value: 0.05
    grain: external_analog_weak
    note: AAMC order-of-magnitude; MCAT allows multiple sittings per year — weak analog.

# How we pin tn_post_neet_calibrated
calibration:
  relative_admit_prob: 1.75
  decay_of_r1: [0.65, 0.45, 0.35]
  note: >
    ρ=1.75 is mid of the 1.5–2.0 teaching range (repeaters more likely to get seats).
    Sets r1 ≈ implied applicant repeater share so P(K=1) matches the binary algebra.

# Beta priors on continuation probabilities r_t = P(sit again | reached sitting t)
# Central means kept for sensitivity; calibrated scenario overrides r1 via algebra.
beta_priors:
  after_sitting_1: { alpha: 7, beta: 5 }   # mean 0.583 — near TN-calibrated r1 under ρ=1.75
  after_sitting_2: { alpha: 4, beta: 7 }   # mean ~0.36
  after_sitting_3: { alpha: 3, beta: 8 }   # mean ~0.27
  after_sitting_4_plus: { alpha: 2, beta: 9 }  # mean 0.182

scenarios:
  low_persistence:
    label: Low persistence
    continuation:
      after_1: 0.30
      after_2: 0.20
      after_3: 0.15
      after_4_plus: 0.10
  central:
    label: Central (unanchored sensitivity)
    continuation:
      after_1: 0.50
      after_2: 0.33
      after_3: 0.25
      after_4_plus: 0.17
  high_persistence:
    label: High persistence
    continuation:
      after_1: 0.70
      after_2: 0.50
      after_3: 0.35
      after_4_plus: 0.25
  # tn_post_neet_calibrated is injected in code from anchors + calibration.rho

# Resource runway (synthetic household; surveys not person-linked)
runway:
  illiquid_pledgeable_shares: [0.0, 0.10, 0.20]
  burden_components:
    - coaching
    - exam_materials
    - travel
    - hostel_relocation
    - incremental_living
    - opportunity_cost
  formula: >
    R = log( (liquid + expected_disposable_1y + borrowing_capacity)
             / repeat_year_burden )
  sources:
    burden: CMSE 2025 coaching/boarding (school frame; weak for full-time droppers)
    consumption_floor: HCES 2023-24
    assets_debt: AIDIS 2019
    opportunity_cost: PLFS
    time_competing: TUS 2024 (gendered persistence; no NEET ID)

competing_risks_after_each_sitting:
  - acceptable_seat_joined
  - repeat_next_year
  - alternative_education
  - employment
  - resource_constrained_exit
  - psychological_or_voluntary_exit

warnings:
  - Continuation rates are labeled sensitivity, not NEET national estimates.
  - tn_post_neet_calibrated anchors only P(K=1) to TN admitted composition under labeled ρ; later r₂,r₃,r₄+ use assumed decay — not a calibrated full attempt distribution.
  - Do not use a constant geometric q (continuation should decay with attempt/age/cost).
  - Rajan / AIIMS-Bhopal figures are admitted composition, not applicant attempt histograms.
  - Class XII completion year gap D is a better administrative proxy than age alone.
  - National admitted birth years are not in-repo; RTI Template 1b is the ask.
