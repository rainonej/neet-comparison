model_version: 0.5.2
purpose: score_rank_seat_privilege_inequality_story
production_pathway: true
causal_language: prohibited

narrative:
  short: >-
    Privilege and coaching shift latent NEET scores; scarce seats are allocated by rank;
    affordability turns private offers into accessible seats. A seat then widens earnings
    versus same-background peers who miss. Mobility is real; meritocracy is not.
  arms_race: >-
    Holding others fixed, prep raises private admission odds (β1>0). When the whole pool
    escalates equally, relative ranks barely move while costs rise (β2<0 / positional externality).
    NEET-specific coaching LATEs are unidentified; we use skeptical international priors.

# Empirical NEET marks (processed quantiles; optional full centre-marks CSV).
score_distribution:
  quantiles_csv: data/processed/neet_2024_marks_quantiles.csv
  summary_csv: data/processed/neet_2024_marks_summary.csv
  marks_csv_optional: data/external/neet-2024-center-marks.csv
  n_appeared: 2333162
  evidence_class: same_population_complete_counts

# National capacity accounting (NMC snapshot). Not P(offer|applicant,state,category).
nmc_capacity:
  government_like_seats: 63859
  private_like_seats: 65743
  total_mbbs_seats: 129602
  source: NMC MBBS college list scrape
  evidence_class: capacity_accounting

# Two-part coaching score model (SD units of national marks distribution).
#
#   δ = 1{S>0} * θ  +  1{S>0} * β_doubling * log2(S / S_median)
#
# θ = jump from no structured prep → some targeted prep
# β_doubling = incremental return to doubling positive spend (diminishing / weak)
#
# Literature-backed skeptical priors (NOT NEET LATEs):
#   θ ~ N(0.12, 0.10^2)   # ~0.1–0.3 SD test-prep meta; Colombia ~0.07; Dongre ~0.14
#   β_doubling ~ N(0.05, 0.08^2)  # Korea: modest returns to +10% spend; no universal log law
#
# Arms-race scenarios subtract the population-mean δ so equal escalation leaves ranks unchanged.
coaching:
  default_profile: conservative
  functional_form: two_part_log2_spend
  median_positive_spend_inr: 9900  # CMSE Class X-XII coached p50 (school tutoring proxy)
  intensity_spend_multiples_of_median:
    none: 0.0
    modest: 1.0      # at median → intensity term 0; only θ applies
    intensive: 8.0   # ~3 doublings above median (residential / Kota-like cost band)
  profiles:
    # Point values used as plug-in means; full Bayesian draws can sample θ,β from prior.
    "null":
      theta_any_prep_sd: 0.0
      beta_doubling_sd: 0.0
      prior_theta: {mean: 0.0, sd: 0.20}
      prior_beta_doubling: {mean: 0.0, sd: 0.08}
    conservative:
      # Slightly below literature central; null still in the mass.
      theta_any_prep_sd: 0.08
      beta_doubling_sd: 0.03
      prior_theta: {mean: 0.08, sd: 0.08}
      prior_beta_doubling: {mean: 0.03, sd: 0.06}
    literature_central:
      # Recommended skeptical prior means from cross-exam synthesis.
      theta_any_prep_sd: 0.12
      beta_doubling_sd: 0.05
      prior_theta: {mean: 0.12, sd: 0.10}
      prior_beta_doubling: {mean: 0.05, sd: 0.08}
    reasonable:
      # Upper half of 0.1–0.3 SD band; still below commercial-coaching meta ~0.31.
      theta_any_prep_sd: 0.18
      beta_doubling_sd: 0.07
      prior_theta: {mean: 0.18, sd: 0.10}
      prior_beta_doubling: {mean: 0.07, sd: 0.08}
  # Implied plug-in δ by intensity = theta + beta * log2(multiple) for multiple>=1.
  population_mix_for_arms_race:
    none: 0.45
    modest: 0.40
    intensive: 0.15
  neet_descriptive_constraints:
    tn_admitted_coached_2019_20: 0.99
    tn_admitted_repeaters_2020_21: 0.7142
    source: Justice A.K. Rajan Committee
    role: prevalence / composition PPC — not a score LATE
  notes: >-
    Direct NEET coaching→marks LATE is unidentified. Priors triangulate test-prep meta (~0.1–0.3 SD),
    Colombia SaberEs (~0.07 SD), Dongre-Tewary India FE (~0.14 SD), Zhang Gaokao (avg ~0 / heterogeneous),
    Korea spend elasticities (modest), and US mandatory-testing → +16% tutoring (strategic response).

# Medium baseline location shifts (SD), calibrated so English/Tamil govt-offer odds
# roughly match Rajan post-NEET aggregates when coaching is held at modest.
medium_score_shift_sd:
  tamil: -0.12
  english: 0.10
  calibration_target:
    source: Justice A.K. Rajan Committee Table 7.18 post-NEET aggregate
    english_government_rate: 0.09502670581160907
    tamil_government_rate: 0.043419496536577125
  evidence_class: calibrated_to_state_association
  warning: TN counselling-applicant association, not national causal English effect.

# Metro remains a weak labeled knob on scores.
metro_score_shift_sd:
  non_metro: 0.0
  metro: 0.05
  evidence_class: labeled_sensitivity

fees_inr_per_year:
  government_mbbs: 25000
  private_mbbs: 800000
  source: stylized until state fee schedules collected

household_resource_tiers_inr_per_year:
  cannot_afford_private: 300000
  can_afford_private: 2000000
  affordability_rule: private_annual_fee_leq_half_annual_household_resources

# Coaching participation priors by privilege (from NSS Education / CMSE aggregates).
coaching_participation:
  source: nss_education_coaching_joints + cmse_coaching_priors
  # If stratum prep_intensity is fixed in the ladder, these are documentation only.
  # Generator mode can draw C ~ Categorical(weights).
  default_weights_by_privilege:
    low:
      none: 0.70
      modest: 0.25
      intensive: 0.05
    mid:
      none: 0.45
      modest: 0.45
      intensive: 0.10
    high:
      none: 0.25
      modest: 0.50
      intensive: 0.25

no_seat_mixture_weights:
  default:
    engineering: 0.45
    law: 0.15
    other_graduate: 0.40
  high_privilege:
    engineering: 0.50
    law: 0.20
    other_graduate: 0.30
  low_privilege:
    engineering: 0.35
    law: 0.10
    other_graduate: 0.55

# Ordered ladder for story figures (same spirit as privilege_scenarios).
access_ladder:
  - id: tamil_cant_afford_nonmetro_none
    school_medium: tamil
    can_afford_private: false
    metro_proximity: non_metro
    prep_intensity: none
    privilege_tier: low
    label: Tamil · cannot afford private · non-metro · no prep
  - id: tamil_cant_afford_nonmetro_modest
    school_medium: tamil
    can_afford_private: false
    metro_proximity: non_metro
    prep_intensity: modest
    privilege_tier: low
    label: Tamil · cannot afford private · non-metro · modest prep
  - id: english_cant_afford_nonmetro_modest
    school_medium: english
    can_afford_private: false
    metro_proximity: non_metro
    prep_intensity: modest
    privilege_tier: mid
    label: English · cannot afford private · non-metro · modest prep
  - id: english_can_afford_nonmetro_modest
    school_medium: english
    can_afford_private: true
    metro_proximity: non_metro
    prep_intensity: modest
    privilege_tier: mid
    label: English · can afford private · non-metro · modest prep
  - id: english_can_afford_metro_modest
    school_medium: english
    can_afford_private: true
    metro_proximity: metro
    prep_intensity: modest
    privilege_tier: high
    label: English · can afford private · metro · modest prep
  - id: english_can_afford_metro_intensive
    school_medium: english
    can_afford_private: true
    metro_proximity: metro
    prep_intensity: intensive
    privilege_tier: high
    label: English · can afford private · metro · intensive prep

# Arms-race scenarios for figures.
# everyone_*: true universal coaching — focal + population both get that prep (δ_rel ≈ 0).
# rivals_escalate_*: focal keeps labeled prep; only the comparison population is forced.
arms_race_scenarios:
  - id: unilateral
    description: Stratum coaches as labeled; population mean coaching shift subtracted so ranks are relative
    subtract_population_mean_shift: true
  - id: everyone_modest
    description: Entire applicant pool and focal stratum get modest coaching (relative coaching advantage collapses)
    force_all_prep: modest
    subtract_population_mean_shift: true
  - id: everyone_intensive
    description: Entire applicant pool and focal stratum get intensive coaching (pure cost arms race; relative δ ≈ 0)
    force_all_prep: intensive
    subtract_population_mean_shift: true
  - id: rivals_escalate_modest
    description: Focal keeps labeled prep; rivals forced to modest (positional penalty if under-prepped)
    force_population_prep: modest
    subtract_population_mean_shift: true
  - id: rivals_escalate_intensive
    description: Focal keeps labeled prep; rivals forced to intensive (positional penalty if under-prepped)
    force_population_prep: intensive
    subtract_population_mean_shift: true

