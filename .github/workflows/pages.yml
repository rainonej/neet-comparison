name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "reports/interactive/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp reports/interactive/the-accessible-seat.html _site/
          cp reports/interactive/sources-and-methods.html _site/
          cp reports/interactive/shareable-flyer.html _site/
          cp reports/interactive/flyer-qr.png _site/
          cp reports/interactive/story-data.js _site/
          cp reports/interactive/visual-essay.css _site/
          cp reports/interactive/visual-essay.js _site/
          cp reports/interactive/question-bank.json _site/
          cp reports/interactive/question-bank.css _site/
          # Root URL serves the essay
          cp reports/interactive/the-accessible-seat.html _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
