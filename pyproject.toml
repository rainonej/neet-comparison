[project]
name = "neet-life-course-data-audit"
version = "0.1.0"
description = "Source audit and reproducible data collection for a NEET life-course microsimulation"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=2.0",
  "scipy>=1.13",
  "pyarrow>=16",
  "requests>=2.32",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "pypdf>=5.0",
  "pdfplumber>=0.11",
  "openpyxl>=3.1",
  "pyyaml>=6.0",
  "tenacity>=8.2",
  "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
